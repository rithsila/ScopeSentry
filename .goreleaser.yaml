# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: ScopeSentry
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
    env:
      - GOAMD64=v1
    main: ./cmd/main
    binary: ScopeSentry
    ldflags:
      - -s -w
      - -X github.com/Autumn-27/ScopeSentry/internal/constants.Version={{.Version}}

  - id: scopesentry-cli
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
    env:
      - GOAMD64=v1
    main: ./cmd/scopesentry
    binary: scopesentry
    ldflags:
      - -s -w

archives:
  - id: default
    builds:
      - ScopeSentry
    format: zip
    name_template: "ScopeSentry_{{ .Os }}_{{ .Arch }}"

  # Separate archives avoid case-insensitive ScopeSentry/scopesentry collisions.
  - id: cli
    builds:
      - scopesentry-cli
    format: zip
    name_template: "scopesentry-cli_{{ .Os }}_{{ .Arch }}"

changelog:
  disable: true

release:
  github:
    owner: Autumn-27
    name: ScopeSentry
  name_template: "ScopeSentry {{.Version}}"

dist: ./dist
